{% load i18n static %}
{% if user.is_authenticated %}
  <form class="vote-control" method="post" action="{% url 'project_vote' project.pk %}" hx-post="{% url 'project_vote' project.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.POST.next|default:request.get_full_path }}">
    <button class="vote-button" type="submit" aria-pressed="{{ project.has_voted|yesno:'true,false' }}">
      <svg class="icon icon-small" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#upvote"></use></svg>
      <span class="visually-hidden">{% translate 'Like project' %}</span>
      <span class="vote-count">{{ project.vote_count|default:0 }}</span>
    </button>
  </form>
{% else %}
  <a class="vote-button" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">
    <svg class="icon icon-small" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#upvote"></use></svg>
    <span class="visually-hidden">{% translate 'Log in to like this project' %}</span>
    <span class="vote-count">{{ project.vote_count|default:0 }}</span>
  </a>
{% endif %}
