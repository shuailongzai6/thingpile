[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buildroom"
version = "0.1.0"
description = "A forum and project showcase for people building with AI."
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "markdown-it-py==4.0.0",
    "Pygments==2.21.0",
    "whitenoise[brotli]==6.12.0",
]

[tool.setuptools.packages.find]
include = ["config*", "community*"]
